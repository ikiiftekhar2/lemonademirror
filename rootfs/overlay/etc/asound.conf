# Mirror D4/D5 (2026-10-31): headless ALSA defaults (no PipeWire daemon on this board;
# this overrides pipewire-alsa's default).
#   playback: plug -> dmix   -> hw:0,0 (TAS5806 amps, 48 kHz S16/S32 stereo only)
#   capture:  plug -> softvol "Mic Capture Volume" -> dsnoop -> hw:0,1 (SAI5 I2S mics, 48 kHz S32 2ch)
pcm.mirror_dmix {
	type dmix
	ipc_key 5806
	ipc_perm 0666
	slave {
		pcm "hw:0,0"
		rate 48000
		format S16_LE
		channels 2
		period_size 1024
		buffer_size 4096
	}
}
pcm.mirror_dsnoop {
	type dsnoop
	ipc_key 5807
	ipc_perm 0666
	slave {
		pcm "hw:0,1"
		rate 48000
		format S32_LE
		channels 2
		period_size 1024
		buffer_size 8192
	}
}
pcm.mirror_mic {
	type softvol
	slave.pcm "mirror_dsnoop"
	control {
		name "Mic Capture Volume"
		card 0
	}
	min_dB -10.0
	max_dB 40.0
	resolution 51
}
pcm.mirror_asym {
	type asym
	playback.pcm "mirror_dmix"
	capture.pcm "mirror_mic"
}
pcm.!default {
	type plug
	slave.pcm "mirror_asym"
}
pcm.speakers {
	type plug
	slave.pcm "mirror_dmix"
}
pcm.mic {
	type plug
	slave.pcm "mirror_mic"
}
ctl.!default {
	type hw
	card 0
}
