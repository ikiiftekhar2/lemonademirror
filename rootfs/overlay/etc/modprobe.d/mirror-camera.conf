# Mirror camera hub (2026-10-31): ONE shared virtual camera, fed 1:1 (no conversion) by camhub.service
# from /dev/video0 at 1920x1080 UYVY @30. Any number of apps may read /dev/video10 at the same time.
# exclusive_caps=1: advertises CAPTURE only while camhub is producing (browser/WebRTC compat).
options v4l2loopback devices=1 video_nr=10 card_label=Mirror-Camera exclusive_caps=1 max_buffers=4
